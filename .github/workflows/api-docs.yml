name: Build and publish Python API
on:
  push:
    branches: [main]
    paths:
      - 'src/burnin_pid_fuzzy/**'
      - 'docs/pdoc-template/**'
      - 'docs/api/**'
      - 'tools/build_api_docs.py'
      - 'scripts/build_documentation_figures.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/figures/**'
      - 'images/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'src/burnin_pid_fuzzy/**'
      - 'docs/pdoc-template/**'
      - 'docs/api/**'
      - 'tools/build_api_docs.py'
      - 'scripts/build_documentation_figures.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'docs/figures/**'
      - 'images/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Check committed API documentation
        run: python tools/build_api_docs.py --check
      - run: python tools/build_api_docs.py --output build/api
      - run: python tools/build_api_docs.py --output build/api --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/api
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
